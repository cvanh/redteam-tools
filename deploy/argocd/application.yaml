apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bakkie-tor-egress
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: bakkie
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bakkie
  source:
    repoURL: https://github.com/cvanh/redteam-tools.git
    targetRevision: master
    path: deploy/tor-egress
  destination:
    server: https://kubernetes.default.svc
    namespace: tor-egress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
